[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-order-book"
dynamic = ["version"]
description = "Hummingbot OrderBook extracted as standalone L2 domain sub-package"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "hb-data-type-primitives @ git+https://github.com/MementoRC/hb-data-type-primitives.git@v0.1.0",
]

[project.optional-dependencies]
frames = ["numpy>=1.26", "pandas>=2.1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "order_book/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["order_book"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.15.10"
mypy = ">=1.20.0"
pre-commit = ">=2.15.0"
numpy = ">=1.26"
pandas = ">=2.1"
pandas-stubs = ">=2.1"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.15.10"
mypy = ">=1.20.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"
numpy = ">=1.26"
pandas = ">=2.1"
pandas-stubs = ">=2.1"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
# CI's reusable workflow runs `pixi run test`; it enforces [tool.coverage.report] fail_under.
test = "pytest tests/ --cov=order_book --cov-report=term-missing"
test-quick = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check order_book tests"
format = "ruff format order_book tests"
format-check = "ruff format --check order_book tests"
typecheck = "mypy order_book"
build = "hatchling build"
coverage = "pytest tests/ --cov=order_book --cov-report=term-missing"
quality = { depends-on = ["lint", "format-check", "typecheck"] }
check = { depends-on = ["quality", "typecheck", "coverage"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "divergence: asserts an intentional divergence from hummingbot core (xfail against core)",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true

# hb-data-type-primitives v0.1.0 ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["data_type_primitives"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["order_book"]
omit = ["order_book/__about__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]
# Protocol stubs: a body that is only `...` is a signature, not logic.
exclude_also = ['^\s*\.\.\.\s*$', ':\s*\.\.\.\s*$']

[tool.hummingbot.supersedes]
modules = [
    "hummingbot.core.data_type.order_book_row",
    "hummingbot.core.data_type.order_book_query_result",
    "hummingbot.core.data_type.order_book_message",
    "hummingbot.core.data_type.order_book",
    "hummingbot.core.data_type.composite_order_book",
]
test_paths = [
    "test/hummingbot/core/data_type/test_order_book_message.py",
    "test/hummingbot/core/data_type/test_order_book.py",
]
